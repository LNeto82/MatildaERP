<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradê do Dourado Escuro para o Dourado Claro -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7A5C18;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38F39;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1D280;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo Quadrado com Cantos Arredondados para o Android -->
  <rect width="512" height="512" rx="110" fill="url(#goldGradient)" />
  
  <!-- Ícone da Xícara de Café em Branco Absoluto -->
  <g fill="#FFFFFF" transform="translate(116, 126)">
    <!-- Fumaça/Vapor -->
    <path d="M70,20 C75,5 85,5 90,20 C95,35 105,35 110,20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M110,20 C115,5 125,5 130,20 C135,35 145,35 150,20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M150,20 C155,5 165,5 175,20 C180,35 190,35 195,20" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Corpo da Xícara -->
    <path d="M40,60 L200,60 C200,150 170,180 120,180 C70,180 40,150 40,60 Z" />
    
    <!-- Asa da Xícara -->
    <path d="M200,80 C230,80 240,120 200,140" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
    
    <!-- Pires / Base -->
    <path d="M20,200 L220,200 C230,200 230,210 220,210 L20,210 C10,210 10,200 20,200 Z" />
  </g>
</svg>
